"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$directory\
$git_branch\
$git_status\
$fill\
$c\
$elixir\
$elm\
$golang\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
$conda\
$python\
$time\n  \
[󱞪](fg:birds) \
"""

palette = "turnstyle"

[palettes.turnstyle]
overlay = '#2c4259'
never_enough = '#a3cbd2'
tlc = '#da81aa'
sole = '#d7a275'
gravity = '#75a6eb'
sunshower = '#dfdf90'
birds = '#4fa190'

[directory]
format = "[](fg:overlay)[ $path ]($style)[](fg:overlay) "
style = "bg:overlay fg:gravity"
truncation_length = 1
truncation_symbol = "…/"

[directory.substitutions]
Documents = "󰈙 "
Downloads = " "
Music = " "
Pictures = " "

[fill]
style = "fg:overlay"
symbol = " "

[git_branch]
format = "[](fg:overlay)[ $symbol $branch ]($style)[](fg:overlay) "
style = "bg:overlay fg:sunshower"
symbol = ""

[git_status]
disabled = false
style = "bg:overlay fg:never_enough"
format = '[](fg:overlay)([$all_status$ahead_behind]($style))[](fg:overlay) '
up_to_date = '[ ✓ ](bg:overlay fg:birds)'
untracked = '[?\($count\)](bg:overlay fg:tlc)'
stashed = '[\$](bg:overlay fg:birds)'
modified = '[!\($count\)](bg:overlay fg:tlc)'
renamed = '[»\($count\)](bg:overlay fg:birds)'
deleted = '[✘\($count\)](style)'
staged = '[++\($count\)](bg:overlay fg:tlc)'
ahead = '[⇡\(${count}\)](bg:overlay fg:sunshower)'
diverged = '⇕[\[](bg:overlay fg:birds)[⇡\(${ahead_count}\)](bg:overlay fg:sunshower)[⇣\(${behind_count}\)](bg:overlay fg:sole)[\]](bg:overlay fg:birds)'
behind = '[⇣\(${count}\)](bg:overlay fg:sole)'

[time]
disabled = false
format = " [](fg:overlay)[ $time 󰴈 ]($style)[](fg:overlay)"
style = "bg:overlay fg:sole"
time_format = "%I:%M%P"
use_12hr = false

[username]
disabled = false
format = "[](fg:overlay)[ 󰧱 $user ]($style)[](fg:overlay) "
show_always = true
style_root = "bg:overlay fg:birds"
style_user = "bg:overlay fg:birds"

